[package]
name = "aria"
version = "0.2.0"
description = "Aria — Personal AI Operating System"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
